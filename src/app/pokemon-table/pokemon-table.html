<p-table
  [value]="filteredPokemons()"
  dataKey="id"
  [rowTrackBy]="trackById"
  [paginator]="true"
  [rows]="10"
  [(first)]="first"
  [showCurrentPageReport]="true"
  currentPageReportTemplate="{first}–{last} of {totalRecords}"
  [rowHover]="true"
  [tableStyle]="{ 'min-width': '50rem' }"
>
  <ng-template #caption>
    <div class="caption">
      <p-button label="New Pokémon" icon="pi pi-plus" (onClick)="create.emit()" />
      <p-floatlabel variant="on" class="type-filter">
        <p-multiselect
          inputId="type-filter"
          [formControl]="typeFilter"
          [options]="types"
          [showHeader]="false"
          [showClear]="true"
          scrollHeight="30rem"
          selectedItemsLabel="{0} types"
          fluid
        />
        <label for="type-filter">Filter by type</label>
      </p-floatlabel>
    </div>
  </ng-template>

  <ng-template #header>
    <tr>
      <th scope="col">Sprite</th>
      <th scope="col" pSortableColumn="name">Name <p-sortIcon field="name" /></th>
      <th scope="col">Types</th>
      <th scope="col" pSortableColumn="level">Level <p-sortIcon field="level" /></th>
      <th scope="col" pSortableColumn="capturedAt">
        Capture date <p-sortIcon field="capturedAt" />
      </th>
      <th scope="col">Favorite</th>
      <th scope="col" class="actions-header">Actions</th>
    </tr>
  </ng-template>

  <ng-template #body let-pokemon>
    <tr>
      <td><app-pokemon-sprite [src]="pokemon.imageUrl" [name]="pokemon.name" /></td>
      <td class="name">{{ pokemon.name }}</td>
      <td>
        <div class="types">
          @for (type of pokemon.types; track type) {
            <p-tag [value]="type" [severity]="typeSeverities[type] ?? 'secondary'" />
          }
        </div>
      </td>
      <td>{{ pokemon.level }}</td>
      <td>{{ pokemon.capturedAt | date: 'mediumDate' }}</td>
      <td>
        @if (pokemon.favorite) {
          <i class="pi pi-star-fill favorite" role="img" aria-label="Favorite"></i>
        } @else {
          <i class="pi pi-star not-favorite" role="img" aria-label="Not a favorite"></i>
        }
      </td>
      <td>
        <div class="actions">
          <p-button
            icon="pi pi-pencil"
            severity="secondary"
            [rounded]="true"
            [text]="true"
            [ariaLabel]="'Edit ' + pokemon.name"
            pTooltip="Edit"
            tooltipPosition="top"
            (onClick)="edit.emit(pokemon)"
          />
          <p-button
            icon="pi pi-trash"
            severity="danger"
            [rounded]="true"
            [text]="true"
            [ariaLabel]="'Delete ' + pokemon.name"
            pTooltip="Delete"
            tooltipPosition="top"
            (onClick)="remove.emit(pokemon)"
          />
        </div>
      </td>
    </tr>
  </ng-template>

  <ng-template #emptymessage>
    <tr>
      <td colspan="7" class="empty">No Pokémon found.</td>
    </tr>
  </ng-template>
</p-table>
