<p-toast />
<p-confirmdialog [style]="{ width: '28rem' }" [breakpoints]="{ '640px': '95vw' }" />
<app-pokemon-form-dialog #pokemonForm />

<p-toolbar class="page-header">
  <ng-template #start>
    <div class="brand">
      <p-image [src]="logoUrl" alt="" width="32" height="32" />
      <h1 class="brand-title">Pokédex</h1>
    </div>
  </ng-template>
  <ng-template #end>
    <div class="theme-toggle">
      <label for="dark-mode">Dark mode</label>
      <p-toggleswitch
        inputId="dark-mode"
        [ngModel]="theme.darkMode()"
        (ngModelChange)="theme.setDarkMode($event)"
      >
        <ng-template #handle let-checked="checked">
          <i class="pi theme-toggle-icon" [class.pi-moon]="checked" [class.pi-sun]="!checked"></i>
        </ng-template>
      </p-toggleswitch>
    </div>
  </ng-template>
</p-toolbar>

<main class="page-content">
  <p-table
    #table
    [value]="pokemons()"
    dataKey="id"
    [paginator]="true"
    [rows]="10"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="Showing {first} to {last} of {totalRecords} Pokémon"
    [rowHover]="true"
    [tableStyle]="{ 'min-width': '52rem' }"
  >
    <ng-template #caption>
      <div class="table-caption">
        <p-multiselect
          class="type-filter"
          [options]="types"
          placeholder="Filter by type"
          ariaLabel="Filter by type"
          display="chip"
          [showClear]="true"
          (onChange)="filterByType(table, $event.value)"
          (onClear)="filterByType(table, null)"
        />
        <p-button label="New Pokémon" icon="pi pi-plus" (onClick)="pokemonForm.open()" />
      </div>
    </ng-template>

    <ng-template #header>
      <tr>
        <th scope="col">Sprite</th>
        <th scope="col" pSortableColumn="name">
          <span class="sortable-header">Name <p-sortIcon field="name" /></span>
        </th>
        <th scope="col">Types</th>
        <th scope="col" pSortableColumn="level">
          <span class="sortable-header">Level <p-sortIcon field="level" /></span>
        </th>
        <th scope="col" pSortableColumn="capturedAt">
          <span class="sortable-header">Captured on <p-sortIcon field="capturedAt" /></span>
        </th>
        <th scope="col">Favorite</th>
        <th scope="col">Actions</th>
      </tr>
    </ng-template>

    <ng-template #body let-pokemon>
      <tr>
        <td>
          <p-image
            [src]="pokemon.imageUrl | pokemonImage"
            [alt]="pokemon.name"
            width="64"
            height="64"
            [imageStyle]="{ 'object-fit': 'contain' }"
          />
        </td>
        <td class="pokemon-name">{{ pokemon.name }}</td>
        <td>
          <div class="type-list">
            @for (type of pokemon.types; track type) {
              <p-tag class="type-tag" [attr.data-type]="type" [value]="type" />
            }
          </div>
        </td>
        <td>{{ pokemon.level }}</td>
        <td>{{ pokemon.capturedAt | date: 'mediumDate' }}</td>
        <td>
          @if (pokemon.favorite) {
            <i class="pi pi-star-fill favorite" role="img" aria-label="Favorite"></i>
          } @else {
            <i class="pi pi-star not-favorite" role="img" aria-label="Not a favorite"></i>
          }
        </td>
        <td>
          <div class="row-actions">
            <p-button
              icon="pi pi-pencil"
              severity="secondary"
              [rounded]="true"
              [text]="true"
              [ariaLabel]="'Edit ' + pokemon.name"
              pTooltip="Edit"
              tooltipPosition="top"
              (onClick)="pokemonForm.open(pokemon)"
            />
            <p-button
              icon="pi pi-trash"
              severity="danger"
              [rounded]="true"
              [text]="true"
              [ariaLabel]="'Delete ' + pokemon.name"
              pTooltip="Delete"
              tooltipPosition="top"
              (onClick)="confirmDelete(pokemon)"
            />
          </div>
        </td>
      </tr>
    </ng-template>

    <ng-template #emptymessage>
      <tr>
        <td colspan="7" class="empty-message">No Pokémon found.</td>
      </tr>
    </ng-template>
  </p-table>
</main>
