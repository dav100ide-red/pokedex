<p-toast />

<p-confirmdialog>
  <!-- Rendered with interpolation so a Pokémon name is never interpreted as HTML. -->
  <ng-template #message let-confirmation>
    <div class="confirm-message">
      <i class="pi pi-exclamation-triangle" aria-hidden="true"></i>
      <span>{{ confirmation.message }}</span>
    </div>
  </ng-template>
</p-confirmdialog>

<p-toolbar class="page-header">
  <ng-template #start>
    <div class="brand">
      <p-image [src]="placeholderImage" alt="" width="32" height="32" />
      <h1>Pokédex</h1>
    </div>
  </ng-template>
  <ng-template #end>
    <div class="theme-toggle">
      <label for="dark-mode">Dark mode</label>
      <p-toggleswitch
        inputId="dark-mode"
        [ngModel]="theme.darkMode()"
        (ngModelChange)="theme.setDarkMode($event)"
      >
        <ng-template #handle let-checked="checked">
          <i class="pi" [class.pi-moon]="checked" [class.pi-sun]="!checked" aria-hidden="true"></i>
        </ng-template>
      </p-toggleswitch>
    </div>
  </ng-template>
</p-toolbar>

<main class="page-content">
  <p-card>
    <p-table
      #table
      [value]="pokemons()"
      dataKey="id"
      [paginator]="true"
      [rows]="10"
      [showCurrentPageReport]="true"
      currentPageReportTemplate="{first}–{last} of {totalRecords} Pokémon"
      [rowHover]="true"
      [tableStyle]="{ 'min-width': '52rem' }"
    >
      <ng-template #caption>
        <div class="table-caption">
          <p-multiselect
            class="type-filter"
            [options]="types"
            [(ngModel)]="selectedTypes"
            (ngModelChange)="filterByTypes(table, $event)"
            placeholder="Filter by type"
            ariaLabel="Filter by type"
            selectedItemsLabel="{0} types selected"
            [filter]="false"
            [showClear]="true"
          />
          <p-button label="New Pokémon" icon="pi pi-plus" (onClick)="formDialog.open()" />
        </div>
      </ng-template>

      <ng-template #header>
        <tr>
          <th scope="col">Sprite</th>
          <th scope="col" pSortableColumn="name">Name <p-sortIcon field="name" /></th>
          <th scope="col">Types</th>
          <th scope="col" pSortableColumn="level">Level <p-sortIcon field="level" /></th>
          <th scope="col" pSortableColumn="capturedAt">
            Capture date <p-sortIcon field="capturedAt" />
          </th>
          <th scope="col">Favorite</th>
          <th scope="col">Actions</th>
        </tr>
      </ng-template>

      <ng-template #body let-pokemon>
        <tr>
          <td>
            <p-image
              [src]="pokemon.imageUrl || placeholderImage"
              [alt]="pokemon.imageUrl ? pokemon.name : 'No image'"
              width="64"
              height="64"
              [imageStyle]="{ 'object-fit': 'contain' }"
            />
          </td>
          <td class="pokemon-name">{{ pokemon.name }}</td>
          <td>
            <div class="types">
              @for (type of pokemon.types; track type) {
                <p-tag [value]="type" [style]="typeTagStyles[type]" />
              }
            </div>
          </td>
          <td>{{ pokemon.level }}</td>
          <td>{{ pokemon.capturedAt | date: 'mediumDate' : 'UTC' }}</td>
          <td>
            @if (pokemon.favorite) {
              <i class="pi pi-star-fill favorite" role="img" aria-label="Favorite"></i>
            } @else {
              <i class="pi pi-star not-favorite" role="img" aria-label="Not a favorite"></i>
            }
          </td>
          <td>
            <div class="row-actions">
              <p-button
                icon="pi pi-pencil"
                severity="secondary"
                [rounded]="true"
                [text]="true"
                [ariaLabel]="'Edit ' + pokemon.name"
                pTooltip="Edit"
                tooltipPosition="top"
                (onClick)="formDialog.open(pokemon)"
              />
              <p-button
                icon="pi pi-trash"
                severity="danger"
                [rounded]="true"
                [text]="true"
                [ariaLabel]="'Delete ' + pokemon.name"
                pTooltip="Delete"
                tooltipPosition="top"
                (onClick)="confirmDelete(pokemon)"
              />
            </div>
          </td>
        </tr>
      </ng-template>

      <ng-template #emptymessage>
        <tr>
          <td colspan="7" class="empty-message">No Pokémon found.</td>
        </tr>
      </ng-template>
    </p-table>
  </p-card>
</main>

<app-pokemon-form-dialog #formDialog (created)="create($event)" (updated)="update($event)" />
